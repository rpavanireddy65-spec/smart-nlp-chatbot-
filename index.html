<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBot - AI Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                🤖 <span>SmartBot</span>
            </div>

            <button class="new-chat" onclick="newChat()">
                + New Chat
            </button>

            <div class="sidebar-title">
                Quick Questions
            </div>

            <button class="quick-btn" onclick="quickMessage('What can you do?')">
                💡 What can you do?
            </button>

            <button class="quick-btn" onclick="quickMessage('Tell me about yourself')">
                🤖 About you
            </button>

            <button class="quick-btn" onclick="quickMessage('What is NLP?')">
                🧠 What is NLP?
            </button>

            <button class="quick-btn" onclick="quickMessage('Give me a study tip')">
                📚 Study tip
            </button>

        </aside>


        <!-- Main Chat Area -->
        <main class="chat-area">

            <!-- Header -->
            <header class="chat-header">

                <div class="bot-info">
                    <div class="bot-avatar">🤖</div>

                    <div>
                        <h2>SmartBot</h2>
                        <span class="online">
                            ● Online
                        </span>
                    </div>
                </div>

                <button class="clear-btn" onclick="clearChat()">
                    🗑️
                </button>

            </header>


            <!-- Messages -->
            <section id="chatBox" class="chat-box">

                <div class="message bot-message">

                    <div class="message-avatar">
                        🤖
                    </div>

                    <div>
                        <div class="message-content">
                            Hello! 👋 I'm SmartBot.
                            <br><br>
                            I can understand simple natural-language questions and help you with study, technology, NLP and general queries.
                            <br><br>
                            Try asking me something!
                        </div>

                        <div class="time">
                            Just now
                        </div>
                    </div>

                </div>

            </section>


            <!-- Typing Indicator -->
            <div id="typing" class="typing hidden">

                <span></span>
                <span></span>
                <span></span>

                SmartBot is typing...

            </div>


            <!-- Input Area -->
            <div class="input-area">

                <button class="emoji-btn" onclick="addEmoji()">
                    😊
                </button>

                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your message..."
                    autocomplete="off"
                >

                <button class="send-btn" onclick="sendMessage()">
                    ➤
                </button>

            </div>

            <div class="footer">
                SmartBot • NLP Based Chatbot
            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
